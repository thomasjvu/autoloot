name: Autoloot checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo:check
